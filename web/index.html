    <meta name="theme-color" content="#1A1238" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Math, physics and chemistry for kids aged 4 to 18, from counting to calculus, with Flare, a little flame buddy." />
    <meta name="apple-mobile-web-app-capable" content="yes" />

      href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
      <script>
      // Pick night or day before the first paint, so the page never flashes the wrong one.
      try {
        var pick = (JSON.parse(localStorage.getItem("mathcan.save.v1") || "{}").settings || {}).theme || "auto";
        document.documentElement.dataset.theme = pick === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pick;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
