<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wonderkind on a phone</title>
    <style>
      html, body { margin: 0; background: #000; }
      body { display: flex; justify-content: center; }
      iframe { display: block; width: 390px; height: 844px; border: 0; }
    </style>
  </head>
  <body>
    <!-- Dev only: shows the app in a true 390 × 844 phone frame; pass the app's query string after "?". -->
    <iframe id="phone"></iframe>
    <script>
      document.getElementById("phone").src = "/" + location.search;
    </script>
  </body>
</html>
